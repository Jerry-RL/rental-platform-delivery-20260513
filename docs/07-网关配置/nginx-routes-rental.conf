worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  map $http_x_request_id $req_id {
    default $http_x_request_id;
    "" $request_id;
  }

  upstream user_service { server user-service:8001; }
  upstream vehicle_service { server vehicle-service:8002; }
  upstream order_service { server order-service:8003; }
  upstream payment_service { server payment-service:8004; }
  upstream finance_service { server finance-service:8005; }

  server {
    listen 80;
    server_name _;

    add_header X-Request-Id $req_id always;

    location /api/v1/users/ {
      proxy_set_header X-Request-Id $req_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://user_service;
    }

    location /api/v1/vehicles {
      proxy_set_header X-Request-Id $req_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://vehicle_service;
    }

    location /api/v1/orders {
      proxy_set_header X-Request-Id $req_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://order_service;
    }

    location /api/v1/payments {
      proxy_set_header X-Request-Id $req_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://payment_service;
    }

    location /api/v1/refunds {
      proxy_set_header X-Request-Id $req_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://payment_service;
    }

    location /api/v1/invoices {
      proxy_set_header X-Request-Id $req_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://finance_service;
    }

    location /api/v1/bills {
      proxy_set_header X-Request-Id $req_id;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://finance_service;
    }
  }
}
