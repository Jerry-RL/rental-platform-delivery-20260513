openapi: 3.1.0
info:
  title: Rental Vehicles API
  version: 1.3.0
  description: 车辆域接口（含 GPS 供应商绑定、定位/轨迹）
servers:
  - url: https://api.rental.example.com
paths:
  /api/v1/vehicles:
    get:
      summary: 查询车辆列表
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiPageVehicle'
  /api/v1/vehicles/{vehicleId}:
    get:
      summary: 查询车辆详情
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVehicle'
  /api/v1/vehicles/{vehicleId}/status:
    put:
      summary: 更新车辆运营状态
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statusCode]
              properties:
                statusCode:
                  type: string
                  enum: [AVAILABLE, RENTED, MAINTENANCE, ACCIDENT_HOLD, SCRAPPED]
                reason: { type: string }
                incidentId: { type: string, format: uuid, description: ACCIDENT_HOLD时关联事故单 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVehicle'
  /api/v1/vehicles/{vehicleId}/location:
    get:
      summary: 查询车辆实时定位（按 gps_provider 路由厂商）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVehicleLocation'
  /api/v1/vehicles/{vehicleId}/track:
    get:
      summary: 查询历史轨迹
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: startTime
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: endTime
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVehicleTrack'
  /api/v1/vehicles/{vehicleId}/gps-binding:
    put:
      summary: 绑定 GPS 终端（图强/承载）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gpsProvider, gpsTerminalId]
              properties:
                gpsProvider:
                  type: string
                  enum: [TUQIANG, CHENGZAI_VIDEO_IOT]
                gpsTerminalId: { type: string }
                gpsSim: { type: string }
      responses:
        '200':
          description: OK
components:
  parameters:
    XRequestId: { in: header, name: X-Request-Id, required: false, schema: { type: string } }
    PageNum: { in: query, name: pageNum, schema: { type: integer, default: 1, minimum: 1 } }
    PageSize: { in: query, name: pageSize, schema: { type: integer, default: 20, minimum: 1, maximum: 200 } }
    SortBy: { in: query, name: sortBy, schema: { type: string, default: createdAt } }
    SortOrder: { in: query, name: sortOrder, schema: { type: string, enum: [asc, desc], default: desc } }
    Filter: { in: query, name: filter, schema: { type: string } }
  schemas:
    ApiBase:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        requestId: { type: string }
      required: [code, message, timestamp, requestId]
    ApiResponseVehicle:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Vehicle' }
    ApiPageVehicle:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Vehicle' }
                pageNum: { type: integer }
                pageSize: { type: integer }
                total: { type: integer }
    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        plateNumber: { type: string }
        engineNo: { type: string, description: 发动机号，违章查询必填 }
        vin: { type: string, description: 车架号，违章查询必填 }
        vehicleTypeCode:
          type: string
          enum: [SMALL, LARGE, NEW_ENERGY]
          description: 映射数脉车辆类型
        status: { type: string, deprecated: true }
        statusCode:
          type: string
          enum: [AVAILABLE, RENTED, MAINTENANCE, ACCIDENT_HOLD, SCRAPPED]
        dailyPrice: { type: number, format: double }
        gpsProvider:
          type: string
          enum: [TUQIANG, CHENGZAI_VIDEO_IOT]
          description: TUQIANG=图强/途强物联，CHENGZAI_VIDEO_IOT=承载视频物联
        gpsTerminalId: { type: string }
        gpsSim: { type: string }
    VehicleLocation:
      type: object
      properties:
        vehicleId: { type: string, format: uuid }
        provider: { type: string, enum: [TUQIANG, CHENGZAI_VIDEO_IOT] }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        speedKmh: { type: number, format: double }
        heading: { type: integer }
        locatedAt: { type: string, format: date-time }
        onlineStatus: { type: string, enum: [ONLINE, OFFLINE, UNKNOWN] }
        address: { type: string }
    TrackPoint:
      type: object
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        speedKmh: { type: number, format: double }
        locatedAt: { type: string, format: date-time }
    ApiResponseVehicleLocation:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/VehicleLocation' }
    ApiResponseVehicleTrack:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                vehicleId: { type: string, format: uuid }
                points:
                  type: array
                  items: { $ref: '#/components/schemas/TrackPoint' }
