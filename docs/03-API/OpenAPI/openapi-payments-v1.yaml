openapi: 3.1.0
info:
  title: Rental Payments API
  version: 1.3.0
  description: 支付域接口（含列表分页/排序/过滤）
servers:
  - url: https://api.rental.example.com
paths:
  /api/v1/payments:
    get:
      summary: 查询支付列表
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiPagePayment' }
    post:
      summary: 创建支付
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePayment' }
  /api/v1/refunds:
    post:
      summary: 发起退款
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRefundRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseRefund' }
  /api/v1/payments/bills:
    post:
      summary: 账单支付（B/G端月结）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBillPaymentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePayment' }
  /api/v1/payments/bills/callback:
    post:
      summary: 对公支付回调
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillPaymentCallbackRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePayment' }
components:
  parameters:
    XRequestId: { in: header, name: X-Request-Id, required: false, schema: { type: string } }
    PageNum: { in: query, name: pageNum, schema: { type: integer, default: 1, minimum: 1 } }
    PageSize: { in: query, name: pageSize, schema: { type: integer, default: 20, minimum: 1, maximum: 200 } }
    SortBy: { in: query, name: sortBy, schema: { type: string, default: createdAt } }
    SortOrder: { in: query, name: sortOrder, schema: { type: string, enum: [asc, desc], default: desc } }
    Filter: { in: query, name: filter, schema: { type: string } }
  schemas:
    ApiBase:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        requestId: { type: string }
      required: [code, message, timestamp, requestId]
    ApiResponsePayment:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Payment' }
    ApiPagePayment:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Payment' }
                pageNum: { type: integer }
                pageSize: { type: integer }
                total: { type: integer }
    ApiResponseRefund:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Refund' }
    CreatePaymentRequest:
      type: object
      required: [orderId, amount, channel, settlementMode]
      properties:
        orderId: { type: string, format: uuid }
        amount: { type: number, format: double }
        channel: { type: string, enum: [alipay, wechat, bank] }
        settlementMode: { type: string, enum: [PREPAID, POSTPAID] }
        billingAccountId: { type: string, format: uuid }
        billingPeriod:
          type: string
          description: 月结账期，格式YYYY-MM
    CreateBillPaymentRequest:
      type: object
      required: [billId, amount, channel, billingAccountId, billingPeriod]
      properties:
        billId: { type: string, format: uuid }
        amount: { type: number, format: double }
        channel: { type: string, enum: [bank, transfer, offline] }
        billingAccountId: { type: string, format: uuid }
        billingPeriod:
          type: string
          description: 月结账期，格式YYYY-MM
        settlementMode: { type: string, enum: [POSTPAID], default: POSTPAID }
    BillPaymentCallbackRequest:
      type: object
      required: [billId, channelTxnNo, status, paidAmount]
      properties:
        billId: { type: string, format: uuid }
        channelTxnNo: { type: string }
        status: { type: string, enum: [SUCCESS, FAILED] }
        paidAmount: { type: number, format: double }
        paidAt: { type: string, format: date-time }
        idempotencyKey: { type: string }
    CreateRefundRequest:
      type: object
      required: [orderId, amount]
      properties:
        orderId: { type: string, format: uuid }
        amount: { type: number, format: double }
        reason: { type: string }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        billId: { type: string, format: uuid }
        status: { type: string }
        amount: { type: number, format: double }
        settlementMode: { type: string, enum: [PREPAID, POSTPAID] }
        billingAccountId: { type: string, format: uuid }
        billingPeriod:
          type: string
          description: 月结账期，格式YYYY-MM
        channelTxnNo: { type: string }
    Refund:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string }
        amount: { type: number, format: double }
