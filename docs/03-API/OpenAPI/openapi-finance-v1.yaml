openapi: 3.1.0
info:
  title: Rental Finance API
  version: 1.5.0
  description: 财务域接口（Invoice Adapter、诺诺/百望回调、红冲、合并开票）
servers:
  - url: https://api.rental.example.com
paths:
  /api/v1/invoices:
    get:
      summary: 查询发票列表
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiPageInvoice' }
    post:
      summary: 申请发票
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvoiceRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseInvoice' }
  /api/v1/invoices/{invoiceId}:
    get:
      summary: 查询发票详情（含明细行）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: invoiceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseInvoiceDetail' }
  /api/v1/invoices/{invoiceId}/issue:
    post:
      summary: 提交 Invoice Adapter 开票（诺诺/百望）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: invoiceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueInvoiceRequest' }
      responses:
        '202':
          description: Accepted（异步 ISSUING）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseInvoice' }
  /api/v1/invoices/{invoiceId}/red-flush:
    post:
      summary: 红冲数电发票
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: invoiceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedFlushInvoiceRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseInvoice' }
  /api/v1/invoices/{invoiceId}/manual-record:
    post:
      summary: 人工回录发票（MANUAL 兜底）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: invoiceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualRecordInvoiceRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseInvoice' }
  /api/v1/bills/{billId}/invoices/issue-batch:
    post:
      summary: 按 B/G 账单合并开票
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueBillInvoiceBatchRequest' }
      responses:
        '202':
          description: Accepted
  /api/v1/integrations/invoice/callback/nuonuo:
    post:
      summary: 诺诺开票回调
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OK
  /api/v1/integrations/invoice/callback/baiwang:
    post:
      summary: 百望开票回调
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OK
  /api/v1/bills:
    get:
      summary: 查询账单列表（B/G端）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiPageBill' }
    post:
      summary: 生成账单（按账期聚合）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBillRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBill' }
  /api/v1/bills/{billId}:
    get:
      summary: 查询账单详情
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBill' }
  /api/v1/bills/{billId}/payment-reference:
    post:
      summary: 生成对公回款识别码
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePaymentReference' }
  /api/v1/bills/{billId}/payment-guide:
    get:
      summary: 下载付款指引（户名/账号/识别码/金额）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePaymentGuide' }
  /api/v1/bank-statements/import:
    post:
      summary: 导入银行流水（CSV/Excel）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBankImport' }
  /api/v1/bank-statements/lines:
    get:
      summary: 查询银行流水明细
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: matchStatus
          schema: { type: string, enum: [UNMATCHED, AUTO_MATCHED, MANUAL_MATCHED, IGNORED] }
      responses:
        '200':
          description: OK
  /api/v1/bank-statements/lines/{lineId}/match:
    post:
      summary: 手工匹配流水至账单
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: lineId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchBankLineRequest' }
      responses:
        '200':
          description: OK
  /api/v1/bank-statements/unmatched:
    get:
      summary: 未匹配流水与账龄看板
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: query
          name: agingBucket
          schema: { type: string, enum: [0_30, 31_60, 61_90, 90_PLUS] }
      responses:
        '200':
          description: OK
  /api/v1/bills/{billId}/confirm:
    put:
      summary: 确认账单（进入待支付）
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - in: path
          name: billId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmBillRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseBill' }
components:
  parameters:
    XRequestId: { in: header, name: X-Request-Id, required: false, schema: { type: string } }
    PageNum: { in: query, name: pageNum, schema: { type: integer, default: 1, minimum: 1 } }
    PageSize: { in: query, name: pageSize, schema: { type: integer, default: 20, minimum: 1, maximum: 200 } }
    SortBy: { in: query, name: sortBy, schema: { type: string, default: createdAt } }
    SortOrder: { in: query, name: sortOrder, schema: { type: string, enum: [asc, desc], default: desc } }
    Filter: { in: query, name: filter, schema: { type: string } }
  schemas:
    ApiBase:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        requestId: { type: string }
      required: [code, message, timestamp, requestId]
    ApiResponseInvoice:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Invoice' }
    ApiPageInvoice:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Invoice' }
                pageNum: { type: integer }
                pageSize: { type: integer }
                total: { type: integer }
    ApiResponseBill:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Bill' }
    ApiPageBill:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Bill' }
                pageNum: { type: integer }
                pageSize: { type: integer }
                total: { type: integer }
    CreateInvoiceRequest:
      type: object
      required: [orderId, titleType, invoiceTitle]
      properties:
        orderId: { type: string, format: uuid }
        titleType: { type: string, enum: [PERSONAL, COMPANY] }
        invoiceTitle: { type: string }
        taxNo: { type: string }
        invoiceTitleId: { type: string, format: uuid, description: B/G企业抬头ID }
        invoiceCategory: { type: string, enum: [SPECIAL, NORMAL], default: NORMAL }
        email: { type: string }
        phone: { type: string }
        billId: { type: string, format: uuid }
        lines:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLineItemInput' }
        remark: { type: string }
        idempotencyKey: { type: string, maxLength: 100 }
    IssueInvoiceRequest:
      type: object
      properties:
        provider: { type: string, enum: [NUONUO, BAIWANG], description: 不传则用租户默认 }
        idempotencyKey: { type: string }
        autoSubmit: { type: boolean, default: true }
    RedFlushInvoiceRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
        idempotencyKey: { type: string }
    ManualRecordInvoiceRequest:
      type: object
      required: [providerInvoiceNo, pdfUrl]
      properties:
        providerInvoiceNo: { type: string }
        pdfUrl: { type: string }
        ofdUrl: { type: string }
        issuedAt: { type: string, format: date-time }
        remark: { type: string }
    IssueBillInvoiceBatchRequest:
      type: object
      properties:
        provider: { type: string, enum: [NUONUO, BAIWANG] }
        invoiceCategory: { type: string, enum: [SPECIAL, NORMAL], default: SPECIAL }
        mergeByTitle: { type: boolean, default: true }
        idempotencyKey: { type: string }
    InvoiceLineItemInput:
      type: object
      required: [itemName, taxClassCode, taxRate, amountIncTax]
      properties:
        itemName: { type: string }
        taxClassCode: { type: string, example: '3040502020000000000' }
        taxRate: { type: number, format: double, example: 0.13 }
        quantity: { type: number, format: double, default: 1 }
        unit: { type: string, default: 次 }
        amountIncTax: { type: number, format: double }
        orderId: { type: string, format: uuid }
        plateNumber: { type: string }
    ApiResponseInvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                invoice: { $ref: '#/components/schemas/Invoice' }
                lines:
                  type: array
                  items: { $ref: '#/components/schemas/InvoiceLineItem' }
    ApiResponsePaymentReference:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                billId: { type: string, format: uuid }
                paymentReferenceCode: { type: string }
    ApiResponsePaymentGuide:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                payeeName: { type: string }
                payeeAccount: { type: string }
                paymentReferenceCode: { type: string }
                amountDue: { type: number, format: double }
                remarkTemplate: { type: string }
    ApiResponseBankImport:
      allOf:
        - $ref: '#/components/schemas/ApiBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                importId: { type: string, format: uuid }
                importNo: { type: string }
                lineCount: { type: integer }
                autoMatchedCount: { type: integer }
    MatchBankLineRequest:
      type: object
      required: [billId, matchedAmount]
      properties:
        billId: { type: string, format: uuid }
        matchedAmount: { type: number, format: double }
        matchRule: { type: string, enum: [MANUAL], default: MANUAL }
    BankStatementLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        txnTime: { type: string, format: date-time }
        amount: { type: number, format: double }
        paymentReferenceCode: { type: string }
        matchStatus: { type: string }
        matchedBillId: { type: string, format: uuid }
        remark: { type: string }
    CreateBillRequest:
      type: object
      required: [billingAccountId, accountType, billingPeriod]
      properties:
        billingAccountId: { type: string, format: uuid }
        accountType: { type: string, enum: [B, G] }
        billingPeriod:
          type: string
          description: 月结账期，格式YYYY-MM
        dueDate: { type: string, format: date }
    ConfirmBillRequest:
      type: object
      required: [confirmedBy]
      properties:
        confirmedBy: { type: string, format: uuid }
        confirmRemark: { type: string }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        billId: { type: string, format: uuid }
        invoiceNo: { type: string, description: 平台发票申请号 }
        providerInvoiceNo: { type: string, description: 数电发票号码 }
        amount: { type: number, format: double }
        amountExTax: { type: number, format: double }
        taxAmount: { type: number, format: double }
        taxRate: { type: number, format: double }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, ISSUING, ISSUED, ISSUE_FAILED, RED_FLUSHING, RED_FLUSHED, CANCELLED]
        provider: { type: string, enum: [NUONUO, BAIWANG, MANUAL] }
        invoiceType: { type: string, enum: [BLUE, RED] }
        invoiceCategory: { type: string, enum: [SPECIAL, NORMAL] }
        titleType: { type: string, enum: [PERSONAL, COMPANY] }
        invoiceTitle: { type: string }
        taxNo: { type: string }
        invoiceTitleId: { type: string, format: uuid }
        redFlushRefId: { type: string, format: uuid }
        externalReqNo: { type: string }
        paymentReferenceCode: { type: string }
        remark: { type: string }
        pdfUrl: { type: string }
        ofdUrl: { type: string }
        xmlUrl: { type: string }
        buyerEmail: { type: string }
        buyerPhone: { type: string }
        issuedAt: { type: string, format: date-time }
        issueErrorCode: { type: string }
        issueErrorMessage: { type: string }
        invoiceBatchId: { type: string, format: uuid }
        retryCount: { type: integer }
        createdAt: { type: string, format: date-time }
    InvoiceLineItem:
      type: object
      properties:
        lineNo: { type: integer }
        itemName: { type: string }
        taxClassCode: { type: string }
        taxRate: { type: number, format: double }
        quantity: { type: number, format: double }
        unit: { type: string }
        amountExTax: { type: number, format: double }
        taxAmount: { type: number, format: double }
        amountIncTax: { type: number, format: double }
        orderId: { type: string, format: uuid }
        plateNumber: { type: string }
    Bill:
      type: object
      properties:
        id: { type: string, format: uuid }
        billNo: { type: string }
        billingAccountId: { type: string, format: uuid }
        accountType: { type: string, enum: [B, G] }
        billingPeriod:
          type: string
          description: 月结账期，格式YYYY-MM
        totalAmount: { type: number, format: double }
        paidAmount: { type: number, format: double }
        status: { type: string, enum: [PENDING_CONFIRM, PENDING_PAYMENT, PARTIALLY_PAID, PAID, PAYMENT_FAILED, OVERDUE] }
        confirmedAt: { type: string, format: date-time }
        confirmedBy: { type: string, format: uuid }
        lastPaymentAt: { type: string, format: date-time }
        reconciliationStatus: { type: string, enum: [PENDING, DONE, FAILED] }
        paymentReferenceCode: { type: string, description: 对公回款识别码 }
        dueDate: { type: string, format: date }
        agingDays: { type: integer, description: 账龄天数 }
